<style>
  :root {
    --bg-void: #030405;
    --panel: #0d1017;
    --border: #1c2230;
    --text: #e7ebf0;
    --text-dim: #8a93a3;
    --text-faint: #545d6b;
    --accent: #d4a73c;
    --accent-soft: #e8c878;
    --accent-glow: rgba(212, 167, 60, 0.55);
    --gold: #ffc857;
    --gold-glow: rgba(255, 200, 87, 0.55);
    --risk: #ff5468;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }

  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg-void);
    color: var(--text);
    font-family: var(--font-sans);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }

  noscript { color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; text-align: center; padding: 40px; display: block; }

  #app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 0; }

  #gameContainer {
    position: relative;
    width: 100%;
    height: 100%;
    background: #05070a;
    overflow: hidden;
  }

  canvas#gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 1; cursor: pointer; }

  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 12px 0; z-index: 5; pointer-events: none;
  }
  .hud.hidden { display: none; }

  .stat {
    background: linear-gradient(180deg, rgba(22,24,30,0.72), rgba(8,10,15,0.6));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 5px 11px;
    font-family: var(--font-mono); line-height: 1.2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 4px 14px rgba(0,0,0,0.3);
    pointer-events: auto;
  }
  .stat .label { display: block; font-size: 8px; letter-spacing: 0.12em; color: var(--text-faint); }
  .stat .value { display: block; font-size: 17px; font-weight: 700; color: var(--text); }
  .stat.score .value { color: var(--accent-soft); text-shadow: 0 0 14px var(--accent-glow); }
  .stat.score.pop .value { animation: scorePop 0.32s ease; }
  .stat.bags .value { color: var(--gold); }

  @keyframes scorePop { 0% { transform: scale(1);} 45% { transform: scale(1.32);} 100% { transform: scale(1);} }

  .hud-buttons { display: flex; gap: 6px; pointer-events: auto; margin-top: 2px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(8,10,15,0.55);
    color: var(--text-dim); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s ease, color .2s ease;
  }
  .icon-btn:hover, .icon-btn:focus-visible { border-color: var(--accent-glow); color: var(--accent-soft); outline: none; }

  #flashOverlay { position: absolute; inset: 0; background: rgba(255,70,80,0); pointer-events: none; z-index: 8; }
  #flashOverlay.flash { animation: flashRed .45s ease; }
  @keyframes flashRed { 0% { background: rgba(255,70,80,0.35);} 100% { background: rgba(255,70,80,0);} }

  #achievementToasts { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 12; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  .toast {
    background: linear-gradient(135deg, rgba(24,19,8,0.94), rgba(8,7,4,0.94));
    border: 1px solid var(--gold-glow);
    border-radius: 10px; padding: 8px 16px; font-family: var(--font-mono);
    font-size: 11px; color: var(--gold); text-align: center;
    box-shadow: 0 0 22px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.12);
    opacity: 0; transform: translateY(-10px);
    animation: toastIn .4s ease forwards, toastOut .4s ease 2.6s forwards;
  }
  @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 20px 24px; text-align: center;
    background-color: rgba(3,4,6,0.92);
    background-image:
      radial-gradient(ellipse at 50% 28%, rgba(212,167,60,0.07), transparent 62%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 10; opacity: 1; transform: scale(1); visibility: visible;
    transition: opacity .3s ease, transform .3s ease, visibility .3s;
    overflow-y: auto;
  }
  .screen.hidden { opacity: 0; transform: scale(0.97); visibility: hidden; pointer-events: none; }

  .corner { position: absolute; width: 18px; height: 18px; pointer-events: none; opacity: 0.55; z-index: 11; }
  .corner-tl { top: 14px; left: 14px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-tr { top: 14px; right: 14px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .corner-bl { bottom: 14px; left: 14px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-br { bottom: 14px; right: 14px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  .logo-glow {
    position: relative;
    font-family: var(--font-mono); font-size: clamp(20px, 5.5vw, 30px); font-weight: 800;
    letter-spacing: 0.06em; color: var(--text);
    text-shadow: 0 0 18px var(--accent-glow), 0 0 46px rgba(212,167,60,0.3);
    padding: 0 30px;
  }
  .logo-glow::before, .logo-glow::after {
    content: ''; position: absolute; top: 50%; width: 20px; height: 1px;
  }
  .logo-glow::before { left: 0; background: linear-gradient(90deg, transparent, var(--accent-soft)); }
  .logo-glow::after { right: 0; background: linear-gradient(270deg, transparent, var(--accent-soft)); }
  .logo-glow.small { font-size: 18px; }

  .subtitle { color: var(--text-dim); font-size: 12px; max-width: 340px; line-height: 1.5; }
  .controls-hint { color: var(--text-faint); font-size: 10px; font-family: var(--font-mono); }
  .credit-link { color: var(--accent-soft); text-decoration: none; }
  .credit-link:hover { text-decoration: underline; }

  .text-input {
    font-family: var(--font-mono); font-size: 13px; color: var(--text);
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px; width: 220px; max-width: 80%;
    text-align: center; outline: none;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .text-input:focus { border-color: var(--accent-glow); box-shadow: inset 0 1px 3px rgba(0,0,0,0.3), 0 0 14px rgba(212,167,60,0.25); }

  .btn {
    position: relative;
    overflow: hidden;
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em;
    color: #fbe9c2;
    background: linear-gradient(180deg, rgba(212,167,60,0.2), rgba(212,167,60,0.06));
    border: 1px solid rgba(212,167,60,0.55);
    padding: 11px 26px; border-radius: 10px; cursor: pointer;
    box-shadow: 0 0 18px rgba(212,167,60,0.14), inset 0 1px 0 rgba(255,255,255,0.14);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn::before {
    content: '';
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-18deg);
    transition: left 0.5s ease;
    pointer-events: none;
  }
  .btn:hover::before { left: 130%; }
  .btn:hover, .btn:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 26px rgba(212,167,60,0.32), inset 0 1px 0 rgba(255,255,255,0.18); outline: none; }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: rgba(255,255,255,0.03); border-color: var(--border); color: var(--text-dim); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
  .btn.secondary:hover { border-color: rgba(212,167,60,0.4); color: var(--text); }
  .btn.small { padding: 7px 16px; font-size: 10px; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    width: 240px; max-width: 85%; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
  }
  .toggle-row input { width: 34px; height: 20px; accent-color: var(--accent); cursor: pointer; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 360px; margin: 4px 0; }
  .stat-card { position: relative; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px 8px; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .stat-card .n { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--accent-soft); }
  .stat-card .l { font-family: var(--font-mono); font-size: 8px; color: var(--text-faint); letter-spacing: 0.08em; margin-top: 2px; }

  .leaderboard-list { width: 100%; max-width: 380px; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-family: var(--font-mono); font-size: 11px;
  }
  .lb-row.rank-gold { border-color: rgba(255,215,90,0.55); background: linear-gradient(90deg, rgba(255,215,90,0.1), transparent); }
  .lb-row.rank-gold .rank { color: #ffd75a; }
  .lb-row.rank-silver { border-color: rgba(205,212,222,0.4); background: linear-gradient(90deg, rgba(205,212,222,0.07), transparent); }
  .lb-row.rank-silver .rank { color: #d3d8e0; }
  .lb-row.rank-bronze { border-color: rgba(210,145,85,0.4); background: linear-gradient(90deg, rgba(210,145,85,0.08), transparent); }
  .lb-row.rank-bronze .rank { color: #d99a5c; }
  .lb-row .rank { color: var(--text-faint); width: 20px; }
  .lb-row .name { flex: 1; text-align: left; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .sc { color: var(--accent-soft); font-weight: 700; }
  .lb-row.you { border-color: var(--accent-glow); }
  .lb-empty { color: var(--text-faint); font-size: 11px; font-family: var(--font-mono); padding: 20px 0; }

  .gameover-message { color: var(--risk); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.03em; }
  .new-best { color: var(--gold); font-size: 11px; letter-spacing: .06em; text-shadow: 0 0 10px var(--gold-glow); font-family: var(--font-mono); }

  @media (max-width: 460px) {
    .logo-glow { font-size: 20px; }
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .screen { gap: 8px; padding: 14px 16px; }
  }
  @media (max-height: 320px) {
    .screen { gap: 6px; }
    .subtitle { display: none; }
  }
</style>
</head>
<body>
<noscript>Moai Miles needs JavaScript enabled to run.</noscript>

<div id="app">
  <div id="gameContainer">
    <canvas id="gameCanvas" aria-label="Moai Miles game canvas"></canvas>

    <div class="hud hidden" id="hud">
      <div style="display:flex; gap:6px;">
        <div class="stat score" id="scoreStat"><span class="label">SCORE</span><span class="value" id="scoreValue">0</span></div>
        <div class="stat bags"><span class="label">BAGS</span><span class="value" id="bagValue">0</span></div>
      </div>

        <button id="pauseBtn" class="icon-btn" aria-label="Pause game">⏸</button>
        <button id="muteBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
      </div>
      <div class="stat"><span class="label">BEST</span><span class="value" id="bestValueHud">0</span></div>
    </div>

    <div id="achievementToasts"></div>
    <div id="flashOverlay"></div>

    <div id="startScreen" class="screen">
      <div class="logo-glow">MOAI MILES</div>
      <p class="subtitle">Run the chain. Bag the yield. Clear every moai in your path.</p>
      <input id="usernameInput" class="text-input" type="text" maxlength="14" placeholder="Enter username" />
      <button id="playBtn" class="btn">PLAY</button>
      <div class="btn-row">
        <button id="leaderboardBtn" class="btn secondary small">LEADERBOARD</button>
        <button id="settingsBtn" class="btn secondary small">SETTINGS</button>
      </div>
      <div class="controls-hint">Space / ↑ / tap to jump</div>
      <div class="controls-hint">BEST <span id="bestValueStart">0</span></div>
      <div class="controls-hint">Built by <a class="credit-link" href="https://x.com/22kian_" target="_blank" rel="noopener noreferrer">@22kian_</a></div>
    </div>

    <div id="settingsScreen" class="screen hidden">
      <div class="logo-glow small">SETTINGS</div>
      <label class="toggle-row"><span>Sound effects</span><input type="checkbox" id="sfxToggle" /></label>
      <label class="toggle-row"><span>Music</span><input type="checkbox" id="musicToggle" /></label>
      <label class="toggle-row" id="skinToggleRow" style="display:none;"><span>Rainbow skin</span><input type="checkbox" id="skinToggle" /></label>
      <div class="stats-grid" id="statsGrid"></div>
      <button id="resetStatsBtn" class="btn secondary small">RESET PROGRESS</button>
      <button id="closeSettingsBtn" class="btn">CLOSE</button>
    </div>

    <div id="leaderboardScreen" class="screen hidden">
      <div class="logo-glow small">LEADERBOARD</div>
      <div class="leaderboard-list" id="leaderboardList"></div>
      <div class="controls-hint" id="leaderboardStatus">Loading...</div>
      <button id="closeLeaderboardBtn" class="btn">CLOSE</button>
    </div>

    <div id="pauseScreen" class="screen hidden">
      <div class="logo-glow small">PAUSED</div>
      <button id="resumeBtn" class="btn">RESUME</button>
      <button id="quitBtn" class="btn secondary small">MAIN MENU</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
      <div class="logo-glow small">RUN OVER</div>
      <div class="gameover-message" id="gameOverMessage"></div>
      <div class="stats-grid" id="gameOverStats"></div>
      <div id="newBestBadge" class="new-best" style="display:none;">NEW HIGH SCORE</div>
      <div class="btn-row">
        <button id="restartBtn" class="btn">PLAY AGAIN</button>
        <button id="menuBtn" class="btn secondary small">MAIN MENU</button>
      </div>
      <button id="shareBtn" class="btn secondary small">SHARE ON X</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* =====================================================================
   MOAI MILES — game script
   ---------------------------------------------------------------------
   Sections:
     1. CONFIG + DATA TABLES
     2. DOM REFS
     3. PERSISTENCE (stats, leaderboard, achievements, settings)
     4. AUDIO ENGINE
     5. UTILITIES
     6. STATE
     7. BIOME + WEATHER SYSTEM
     8. MASCOT
     9. OBSTACLES (moai)
    10. COLLECTIBLES (bags)
    11. PARTICLES / EFFECTS
    12. ACHIEVEMENTS
    13. INPUT
    14. UPDATE
    15. RENDER
    16. UI / SCREENS / GAME FLOW
    17. MAIN LOOP + INIT
   ===================================================================== */

/* ------------------------- 1. CONFIG + DATA TABLES -------------------- */
const CONFIG = {
  gravity: 2600,
  jumpVelocity: -920,
  runSpeedStart: 300,
  runSpeedMax: 780,
  speedRampDistance: 9000,

  obstacleGapSafetyMult: 1.25,
  obstacleGapSafetyPad: 70,
  minSpawnGapPx: 40,

  biomeDistance: 1500,
  biomeTransitionDistance: 280,

  weatherCheckMin: 5000,
  weatherCheckMax: 11000,
  weatherDurationMin: 6000,
  weatherDurationMax: 13000,
  weatherChance: 0.45,

  maxDeltaTime: 0.05,
};

const BAG_TYPES = [
  { rarity: 'normal',  value: 10,  weight: 72, color: '#c7ccd6', glow: 'rgba(199,204,214,0.85)' },
  { rarity: 'golden',  value: 50,  weight: 23, color: '#ffc857', glow: 'rgba(255,200,87,0.9)' },
  { rarity: 'rainbow', value: 200, weight: 5,  color: '#ff8fd8', glow: 'rgba(255,143,216,0.9)' },
];

const OBSTACLE_SIZES = [
  { size: 'small',  hMin: 46,  hMax: 60 },
  { size: 'medium', hMin: 66,  hMax: 84 },
  { size: 'tall',   hMin: 92,  hMax: 112 },
];

const BIOMES = [
  { name: 'grassland', skyTop: '#8fd3f4', skyBot: '#e7f7fb', ground: '#4c9a4c', groundEdge: '#2f6b2f', soil: '#3d6b3a', accent: '#7ed957', mountains: '#5f8f6f', midground: '#7bab7f', clouds: '#ffffff', atmosphere: 'rgba(255,246,220,0.04)', decoTypes: ['grass', 'flower', 'bush'] },
  { name: 'rocky',     skyTop: '#c9c2b4', skyBot: '#efe9dc', ground: '#7d746a', groundEdge: '#544c44', soil: '#5c5248', accent: '#a89f92', mountains: '#847a6e', midground: '#9a8f80', clouds: '#f7f3ea', atmosphere: 'rgba(210,198,180,0.07)', decoTypes: ['rock', 'boulder', 'crack'] },
  { name: 'desert',    skyTop: '#f6c667', skyBot: '#ffe9b3', ground: '#dbb26b', groundEdge: '#a97f45', soil: '#8a6136', accent: '#e8c07d', mountains: '#c99a5c', midground: '#d9a866', clouds: '#fff3d6', atmosphere: 'rgba(255,196,110,0.09)', decoTypes: ['dune', 'cactus', 'plant', 'rock'] },
  { name: 'night',     skyTop: '#0b1330', skyBot: '#1c2b52', ground: '#232a3d', groundEdge: '#131826', soil: '#161c2c', accent: '#4da3ff', mountains: '#1a2440', midground: '#222c48', clouds: '#2a3658', atmosphere: 'rgba(80,110,210,0.08)', decoTypes: ['crystal', 'rock'] },
  { name: 'snow',      skyTop: '#cfe8f5', skyBot: '#f2fbff', ground: '#e7f1f5', groundEdge: '#b9d3dd', soil: '#a9c6d1', accent: '#ffffff', mountains: '#c3dbe5', midground: '#d3e6ee', clouds: '#ffffff', atmosphere: 'rgba(255,255,255,0.12)', decoTypes: ['pine', 'snowdrift'] },
];

const GAME_OVER_MESSAGES = [
  'Rugged by a moai.',
  'Your bags got liquidated.',
  'Slippage hit different.',
  'That protocol wasn\'t audited.',
  'Front-run by a statue.',
  'Concrete doesn\'t crumble. You did.',
  'Gas fees ate your run.',
  'Diamond hands, paper legs.',
  'Should\'ve read the whitepaper.',
  'The chain kept moving without you.',
];

const ACHIEVEMENT_DEFS = [
  { id: 'first_run',  name: 'First run',     desc: 'Complete your first run.' },
  { id: 'bags_100',   name: '100 bags',      desc: 'Collect 100 bags lifetime.' },
  { id: 'bags_1000',  name: '1000 bags',     desc: 'Collect 1000 bags lifetime.' },
  { id: 'dist_5000',  name: '5000 distance', desc: 'Travel 5000m lifetime.' },
  { id: 'moai_survivor', name: 'Moai survivor', desc: 'Clear 30 moai in one run.' },
  { id: 'legend',     name: 'Legend',        desc: 'Score 5000 in one run.' },
];

const FONT_MONO = '"JetBrains Mono", "SFMono-Regular", Consolas, monospace';

/* ------------------------- 2. DOM REFS --------------------------------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('gameContainer');

const hudEl = document.getElementById('hud');
const scoreValueEl = document.getElementById('scoreValue');
const scoreStatEl = document.getElementById('scoreStat');
const bagValueEl = document.getElementById('bagValue');
const bestValueHudEl = document.getElementById('bestValueHud');
const bestValueStartEl = document.getElementById('bestValueStart');
const flashOverlayEl = document.getElementById('flashOverlay');

const startScreenEl = document.getElementById('startScreen');
const settingsScreenEl = document.getElementById('settingsScreen');
const leaderboardScreenEl = document.getElementById('leaderboardScreen');
const pauseScreenEl = document.getElementById('pauseScreen');
const gameOverScreenEl = document.getElementById('gameOverScreen');

const usernameInputEl = document.getElementById('usernameInput');
const playBtn = document.getElementById('playBtn');
const leaderboardBtn = document.getElementById('leaderboardBtn');
const settingsBtn = document.getElementById('settingsBtn');
const closeSettingsBtn = document.getElementById('closeSettingsBtn');
const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
const resetStatsBtn = document.getElementById('resetStatsBtn');
const sfxToggle = document.getElementById('sfxToggle');
const musicToggle = document.getElementById('musicToggle');

/* ------------------------- 3. PERSISTENCE ------------------------------- */
const STORAGE_KEYS = {
  stats: 'moaiMiles_stats_v1',
  leaderboard: 'moaiMiles_leaderboard_v1',
  achievements: 'moaiMiles_achievements_v1',
  settings: 'moaiMiles_settings_v1',
  username: 'moaiMiles_username_v1',
};

function safeGetJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function safeSetJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
}

function defaultStats() {
  return { bestScore: 0, gamesPlayed: 0, totalBags: 0, totalDistance: 0, totalJumps: 0 };
}
function loadStats() { return Object.assign(defaultStats(), safeGetJSON(STORAGE_KEYS.stats, {})); }
function saveStats(stats) { safeSetJSON(STORAGE_KEYS.stats, stats); }

function loadAchievements() { return safeGetJSON(STORAGE_KEYS.achievements, {}); }
function saveAchievements(a) { safeSetJSON(STORAGE_KEYS.achievements, a); }

function loadLeaderboard() { return safeGetJSON(STORAGE_KEYS.leaderboard, []); }
function saveLeaderboard(list) { safeSetJSON(STORAGE_KEYS.leaderboard, list); }
// Stored and shaped like an API response { name, score, distance, bags, date } so a real
// fetch()-based leaderboard endpoint can replace loadLeaderboard/addLeaderboardEntry later
// without touching any rendering code.
function addLeaderboardEntry(entry) {
  const list = loadLeaderboard();
  list.push(entry);
  list.sort((a, b) => b.score - a.score);
  const trimmed = list.slice(0, 20);
  saveLeaderboard(trimmed);
  return trimmed;
}

function defaultSettings() { return { sfx: true, music: true, rainbowSkin: false, rainbowSkinUnlocked: false }; }
function loadSettings() { return Object.assign(defaultSettings(), safeGetJSON(STORAGE_KEYS.settings, {})); }
function saveSettings(s) { safeSetJSON(STORAGE_KEYS.settings, s); }

function loadUsername() {
  try { return localStorage.getItem(STORAGE_KEYS.username) || ''; } catch (e) { return ''; }
}
function saveUsername(name) {
  try { localStorage.setItem(STORAGE_KEYS.username, name); } catch (e) { /* ignore */ }
}

/* ------------------------- 4. AUDIO ENGINE ------------------------------
   All sound is synthesized with the Web Audio API — no mp3/wav files,
   so the game has zero external assets and works fully offline. Music
   is a lightweight procedural arpeggio loop, not a produced track.
--------------------------------------------------------------------------- */
let audioCtx = null;
let musicTimer = null;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone({ freq = 440, duration = 0.15, type = 'sine', volume = 0.2, glideTo = null, delay = 0 }) {
  if (!settings.sfx || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(glideTo, 1), t0 + duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playNoiseBurst(duration = 0.22, volume = 0.18) {
  if (!settings.sfx || !audioCtx) return;
  const size = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
  const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1600;
  const gain = audioCtx.createGain();
  gain.gain.value = volume;
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start();
}

function playJumpSound() { playTone({ freq: 420, duration: 0.14, type: 'triangle', volume: 0.15, glideTo: 640 }); }
function playLandSound() { playTone({ freq: 180, duration: 0.08, type: 'sine', volume: 0.1, glideTo: 90 }); }
function playCollectSound(rarity) {
  if (rarity === 'rainbow') {
    playTone({ freq: 700, duration: 0.09, type: 'triangle', volume: 0.16, glideTo: 1050 });
    playTone({ freq: 1050, duration: 0.12, type: 'triangle', volume: 0.14, glideTo: 1400, delay: 0.06 });
  } else if (rarity === 'golden') {
    playTone({ freq: 660, duration: 0.1, type: 'triangle', volume: 0.16, glideTo: 980 });
  } else {
    playTone({ freq: 560, duration: 0.08, type: 'triangle', volume: 0.14, glideTo: 780 });
  }
}
function playHitSound() {
  playTone({ freq: 200, duration: 0.4, type: 'sawtooth', volume: 0.2, glideTo: 50 });
  playNoiseBurst(0.25, 0.16);
}
function playClickSound() { playTone({ freq: 340, duration: 0.05, type: 'square', volume: 0.1 }); }
function playAchievementSound() {
  playTone({ freq: 520, duration: 0.1, type: 'triangle', volume: 0.15, glideTo: 780 });
  playTone({ freq: 780, duration: 0.14, type: 'triangle', volume: 0.13, glideTo: 1040, delay: 0.1 });
}

const MUSIC_PATTERN = [261.6, 329.6, 392.0, 329.6, 293.7, 392.0, 440.0, 392.0];
let musicStep = 0;
function scheduleMusicStep() {
  if (!settings.music || !audioCtx) { musicTimer = setTimeout(scheduleMusicStep, 400); return; }
  const freq = MUSIC_PATTERN[musicStep % MUSIC_PATTERN.length];
  playTone({ freq, duration: 0.5, type: 'sine', volume: 0.05 });
  musicStep++;
  musicTimer = setTimeout(scheduleMusicStep, 420);
}
function startMusic() { if (!musicTimer) scheduleMusicStep(); }
function stopMusic() { clearTimeout(musicTimer); musicTimer = null; }

/* ------------------------- 5. UTILITIES --------------------------------- */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function randRange(min, max) { return min + Math.random() * (max - min); }
function randInt(min, max) { return Math.floor(randRange(min, max + 1)); }

function debounce(fn, wait) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); };
}

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
}
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(lerp(a.r, b.r, t));
  const g = Math.round(lerp(a.g, b.g, t));
  const bl = Math.round(lerp(a.b, b.b, t));
  return `rgb(${r},${g},${bl})`;
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// Lightens (positive amount) or darkens (negative) a hex color by a 0-1 fraction.
function shadeColor(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const adj = (c) => clamp(Math.round(c + amount * 255), 0, 255);
  return `rgb(${adj(r)},${adj(g)},${adj(b)})`;
}

// Fills a rect with a grid of solid, hard-edged squares picked from `shades` —
// the core "Minecraft" technique: no gradients or curves, just deliberately
// chunky pixels. `seed` should be stable per-object (its slot index, not its
// live screen position) so the texture doesn't flicker as it scrolls.
function drawPixelBlock(x, y, w, h, seed, shades, pixelSize) {
  const cols = Math.max(1, Math.round(w / pixelSize));
  const rows = Math.max(1, Math.round(h / pixelSize));
  const pw = w / cols, ph = h / rows;
  for (let cy = 0; cy < rows; cy++) {
    for (let cx = 0; cx < cols; cx++) {
      const cellSeed = seededRandom(seed * 97.7 + cx * 13.1 + cy * 29.3 + 1);
      ctx.fillStyle = shades[Math.floor(cellSeed * shades.length)];
      ctx.fillRect(x + cx * pw, y + cy * ph, pw + 0.6, ph + 0.6);
    }
  }
}

function weightedPick(list) {
  const total = list.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const item of list) {
    if (r < item.weight) return item;
    r -= item.weight;
  }
  return list[0];
}

function seededRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

let canvasHeight = 0;
let groundY = 0;

  collectibles: [],

  achievementQueue: [],
};

function worldToScreenX(worldX) { return worldX - game.distance + game.mascot.x; }

/* ------------------------- 7. BIOME + WEATHER + WORLD LAYERS ------------ */
function biomeBlend() {
  const f = game.distance / CONFIG.biomeDistance;
  const idx = Math.floor(f) % BIOMES.length;
  const nextIdx = (idx + 1) % BIOMES.length;
  const within = f - Math.floor(f);
  const transitionFraction = CONFIG.biomeTransitionDistance / CONFIG.biomeDistance;
  const transitionStart = 1 - transitionFraction;
  let t = 0;
  if (within > transitionStart) t = (within - transitionStart) / transitionFraction;
  return { a: BIOMES[idx], b: BIOMES[nextIdx], t: clamp(t, 0, 1) };
}

function updateWeather(dt) {
  const w = game.weather;
  if (w.type) {
    w.timeLeft -= dt * 1000;
    if (w.timeLeft <= 0) {
      w.type = null;
      w.nextCheckIn = randRange(CONFIG.weatherCheckMin, CONFIG.weatherCheckMax);
    }
  } else {
    w.nextCheckIn -= dt * 1000;
    if (w.nextCheckIn <= 0) {
      if (Math.random() < CONFIG.weatherChance) {
        w.type = ['rain', 'fog', 'wind'][randInt(0, 2)];
        w.timeLeft = randRange(CONFIG.weatherDurationMin, CONFIG.weatherDurationMax);
      } else {
        w.nextCheckIn = randRange(CONFIG.weatherCheckMin, CONFIG.weatherCheckMax);
      }
    }
  }
}

/* ------------------------- camera ---------------------------------------
   Pure visual layer. Nothing here touches game.mascot.x, worldToScreenX(), or
   any collision math — those stay exactly as they were. The camera is only
   ever applied as an extra ctx transform inside render(), after gameplay has
   already been resolved for the frame.
--------------------------------------------------------------------------- */
const camera = { offsetY: 0, zoom: 1, bounceTime: 0, bounceDuration: 0.22, bounceMag: 9 };

function triggerCameraBounce() { camera.bounceTime = camera.bounceDuration; }

function updateCamera(dt) {
  const airT = clamp((groundY - (game.mascot.y + game.mascot.h)) / 160, 0, 1);
  const followTarget = -airT * 9;
  camera.offsetY += (followTarget - camera.offsetY) * clamp(dt * 7, 0, 1);

  if (camera.bounceTime > 0) {
    camera.bounceTime = Math.max(0, camera.bounceTime - dt);
    const p = 1 - camera.bounceTime / camera.bounceDuration;
    camera.offsetY += Math.sin(p * Math.PI) * (1 - p) * camera.bounceMag;
  }

  const speedT = clamp((game.speed - CONFIG.runSpeedStart) / (CONFIG.runSpeedMax - CONFIG.runSpeedStart), 0, 1);
  const targetZoom = lerp(1, 0.94, speedT);
  camera.zoom += (targetZoom - camera.zoom) * clamp(dt * 1.5, 0, 1);
}

// Screen X for a background layer scrolling at a fraction of full gameplay speed —
// the standard multi-plane parallax trick. speedMult=1 matches worldToScreenX
// exactly; <1 drifts slower (distant layers), >1 drifts faster (foreground).
function parallaxScreenX(worldX, speedMult) {
  return (worldX - game.distance) * speedMult + game.mascot.x;
}

/* ------------------------- world layers ----------------------------------- */
function drawSky(blend) {
  const top = lerpColor(blend.a.skyTop, blend.b.skyTop, blend.t);
  const bot = lerpColor(blend.a.skyBot, blend.b.skyBot, blend.t);
  const pad = canvasWidth * 0.08;
  const g = ctx.createLinearGradient(0, -pad, 0, groundY);
  g.addColorStop(0, top);
  g.addColorStop(1, bot);
  ctx.fillStyle = g;
  ctx.fillRect(-pad, -pad, canvasWidth + pad * 2, groundY + pad);

  const nightA = blend.a.name === 'night', nightB = blend.b.name === 'night';
  if (nightA || nightB) {
    const alpha = nightA ? (1 - blend.t) : blend.t;
    if (alpha > 0.05) {
      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
      for (let i = 0; i < 50; i++) {
        const sx = (seededRandom(i * 91.7) * canvasWidth * 3 - game.distance * 0.05) % canvasWidth;
        const sy = seededRandom(i * 53.3) * groundY * 0.7;
        const r = seededRandom(i * 17.1) * 1.4 + 0.4;
        ctx.beginPath();
        ctx.arc((sx + canvasWidth) % canvasWidth, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      if (alpha > 0.5) {
        ctx.save();
        ctx.globalAlpha = (alpha - 0.5) * 2;
        ctx.fillStyle = 'rgba(230,238,255,0.9)';
        ctx.shadowColor = 'rgba(200,215,255,0.55)';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(canvasWidth * 0.78, groundY * 0.22, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }
}

// Rolling hill silhouettes between the far mountains and the gameplay ground —
// this is where genuine elevation variation lives, kept separate from the flat
// gameplay strip so collision never has to reason about uneven terrain.
function drawMidground(blend) {
  const color = lerpColor(blend.a.midground, blend.b.midground, blend.t);
  const speedMult = 0.45;
  const spacing = 260;
  const baseY = groundY - 4;
  const startSlot = Math.floor((game.distance - game.mascot.x / speedMult) / spacing) - 1;
  const endSlot = Math.ceil((game.distance + (canvasWidth - game.mascot.x) / speedMult) / spacing) + 1;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-40, canvasHeight + 40);
  ctx.lineTo(-40, baseY);
  for (let slot = startSlot; slot <= endSlot; slot++) {
    const h = 26 + seededRandom(slot * 9.1) * 30;
    const sxMid = parallaxScreenX((slot + 0.5) * spacing, speedMult);
    const sxEnd = parallaxScreenX((slot + 1) * spacing, speedMult);
    ctx.quadraticCurveTo(sxMid, baseY - h, sxEnd, baseY);
  }
  ctx.lineTo(canvasWidth + 40, baseY);
  ctx.lineTo(canvasWidth + 40, canvasHeight + 40);
  ctx.closePath();
  ctx.fill();
}

function drawParallaxLayer(color, speedMult, baseY, amp, tileWidth) {
  ctx.fillStyle = color;
  const offset = (game.distance * speedMult) % tileWidth;
  for (let i = -2; i < canvasWidth / tileWidth + 3; i++) {
    const cx = i * tileWidth - offset;
    ctx.beginPath();
    ctx.moveTo(cx - tileWidth * 0.55, groundY + 20);
    ctx.lineTo(cx - tileWidth * 0.15, baseY - amp * 0.9);
    ctx.lineTo(cx + tileWidth * 0.15, baseY - amp * 0.4);
    ctx.lineTo(cx + tileWidth * 0.55, baseY);
    ctx.lineTo(cx + tileWidth * 0.55, groundY + 20);
    ctx.closePath();
    ctx.fill();
  }
}

function drawClouds(color, speedMult) {
  ctx.fillStyle = color;
  const tileWidth = 260;
  const offset = (game.distance * speedMult) % tileWidth;
  for (let i = -2; i < canvasWidth / tileWidth + 3; i++) {
    const seed = i + Math.floor(game.distance / (tileWidth * 40));
    const cx = i * tileWidth - offset + seededRandom(seed * 5.5) * 60;
    const cy = groundY * (0.16 + seededRandom(seed * 8.2) * 0.22);
    const scale = 0.7 + seededRandom(seed * 3.3) * 0.6;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 26 * scale, 12 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 20 * scale, cy + 3 * scale, 18 * scale, 10 * scale, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - 18 * scale, cy + 4 * scale, 16 * scale, 9 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// The gameplay ground stays perfectly flat at groundY (collision-accurate,
// gameplay is untouched) but now reads as layered terrain: a soil base, a
// surface band (grass/sand/snow/etc per biome), and fine procedural grain.
function drawGround(blend) {
  const groundColor = lerpColor(blend.a.ground, blend.b.ground, blend.t);
  const edgeColor = lerpColor(blend.a.groundEdge, blend.b.groundEdge, blend.t);
  const soilColor = lerpColor(blend.a.soil, blend.b.soil, blend.t);
  const lightShade = shadeColor(groundColor, 0.14);
  const darkShade = shadeColor(groundColor, -0.12);
  const surfaceHeight = Math.max(16, (canvasHeight - groundY) * 0.32);

  ctx.fillStyle = soilColor;
  ctx.fillRect(-40, groundY, canvasWidth + 80, canvasHeight - groundY + 60);

  // Blocky surface band: a world-anchored grid of hard-edged squares in 3
  // shades (the actual "Minecraft" technique), so it scrolls smoothly with
  // everything else instead of reading as a flat painted color.
  const pixelSize = 8;
  const rows = Math.max(1, Math.round(surfaceHeight / pixelSize));
  const rowH = surfaceHeight / rows;
  const colOffset = game.distance % pixelSize;
  for (let gx = -colOffset - pixelSize; gx < canvasWidth + pixelSize; gx += pixelSize) {
    const colSeed = Math.floor((gx + game.distance) / pixelSize);
    for (let row = 0; row < rows; row++) {
      const cellSeed = seededRandom(colSeed * 17.3 + row * 41.1 + 1);
      ctx.fillStyle = cellSeed < 0.16 ? darkShade : (cellSeed < 0.34 ? lightShade : groundColor);
      ctx.fillRect(gx, groundY + row * rowH, pixelSize + 0.6, rowH + 0.6);
    }
    // occasional dirt fleck poking through the bottom row of the surface band
    const fleckSeed = seededRandom(colSeed * 63.4 + 3);
    if (fleckSeed < 0.09) {
      ctx.fillStyle = soilColor;
      ctx.fillRect(gx, groundY + surfaceHeight - rowH, pixelSize + 0.6, rowH + 0.6);
    }
  }

  ctx.fillStyle = edgeColor;
  ctx.fillRect(-40, groundY, canvasWidth + 80, 3);

  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  const grainSpacing = 34;
  const grainOffset = game.distance % grainSpacing;
  for (let gx2 = -grainOffset - 34; gx2 < canvasWidth + 34; gx2 += grainSpacing) {
    const seed = Math.floor((gx2 + game.distance) / grainSpacing);
    const gy = groundY + surfaceHeight + 6 + seededRandom(seed * 6.6) * Math.max(4, canvasHeight - groundY - surfaceHeight - 10);
    const gs = 2 + seededRandom(seed * 3.3) * 3;
    ctx.beginPath();
    ctx.ellipse(gx2 + seededRandom(seed * 8.8) * 14, gy, gs, gs * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawDecorations(blend) {
  const spacing = 95;
  const startSlot = Math.floor((game.distance - game.mascot.x) / spacing) - 1;
  const endSlot = Math.floor((game.distance + (canvasWidth - game.mascot.x)) / spacing) + 1;
  const types = blend.t < 0.5 ? blend.a.decoTypes : blend.b.decoTypes;
  const decoColor = lerpColor(blend.a.accent, blend.b.accent, blend.t);
  const lightDeco = shadeColor(decoColor, 0.18);
  const darkDeco = shadeColor(decoColor, -0.18);

  for (let slot = startSlot; slot <= endSlot; slot++) {
    const r = seededRandom(slot * 7.13);
    if (r > 0.55) continue;
    const worldX = slot * spacing + seededRandom(slot * 3.1) * 40;
    const sx = worldToScreenX(worldX);
    if (sx < -40 || sx > canvasWidth + 40) continue;
    const scale = 0.7 + seededRandom(slot * 9.9) * 0.7;
    const decoType = types[Math.floor(seededRandom(slot * 4.4) * types.length)];
    ctx.globalAlpha = 0.92;

    if (decoType === 'grass') {
      const px = 2.6 * scale;
      for (let b = 0; b < 3; b++) {
        const bw = 5 * scale, bh = (8 + b % 2 * 3) * scale;
        drawPixelBlock(sx + (b - 1) * bw * 1.1 - bw / 2, groundY - bh, bw, bh, slot * 11.1 + b * 5.5, [decoColor, lightDeco, darkDeco], px);
      }
    } else if (decoType === 'flower') {
      drawPixelBlock(sx - 1, groundY - 10 * scale, 2, 10 * scale, slot * 6.2, ['#4c7a34', shadeColor('#4c7a34', -0.15)], 2.4 * scale);
      const petal = 5 * scale;
      drawPixelBlock(sx - petal / 2, groundY - 10 * scale - petal, petal, petal, slot * 14.4, ['#fff6d8', '#ffe9a8', decoColor], 2.6 * scale);
    } else if (decoType === 'bush') {
      const w = 22 * scale, h = 15 * scale;
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 8.1, [decoColor, lightDeco, darkDeco], 3.4 * scale);
    } else if (decoType === 'rock' || decoType === 'boulder') {
      const w = (decoType === 'boulder' ? 24 : 18) * scale, h = (decoType === 'boulder' ? 17 : 13) * scale;
      // top-left highlight, bottom-right shadow — the classic blocky light-source trick
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 8.8, [darkDeco, decoColor, decoColor, lightDeco], 3.6 * scale);
    } else if (decoType === 'crack') {
      ctx.globalAlpha = 0.4;
      const w = 30 * scale, h = 4 * scale;
      drawPixelBlock(sx - w / 2, groundY - h - 1, w, h, slot * 19.7, ['rgba(0,0,0,0.5)', 'rgba(0,0,0,0.2)'], 3 * scale);
    } else if (decoType === 'dune') {
      // stepped blocky mound instead of a smooth ellipse
      for (let s = 0; s < 3; s++) {
        const stepW = (30 - s * 9) * scale, stepH = 6 * scale;
        drawPixelBlock(sx - stepW / 2, groundY - (s + 1) * stepH, stepW, stepH, slot * 6.6 + s * 3.3, [decoColor, lightDeco, darkDeco], 3.4 * scale);
      }
    } else if (decoType === 'cactus') {
      const cactusGreen = '#4f8f3d';
      const cLight = shadeColor(cactusGreen, 0.16), cDark = shadeColor(cactusGreen, -0.16);
      const w = 9 * scale, h = 27 * scale;
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 9.9, [cactusGreen, cLight, cDark], 2.8 * scale);
      const armW = 5 * scale, armH = 9 * scale;
      drawPixelBlock(sx - w / 2 - armW, groundY - h * 0.55, armW, armH, slot * 13.1, [cactusGreen, cDark], 2.4 * scale);
    } else if (decoType === 'plant') {
      const w = 10 * scale, h = 16 * scale;
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 15.5, [decoColor, darkDeco], 2.6 * scale);
    } else if (decoType === 'crystal') {
      ctx.save();
      ctx.shadowColor = decoColor; ctx.shadowBlur = 8;
      const w = 12 * scale, h = 20 * scale;
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 21.3, [decoColor, lightDeco], 2.6 * scale);
      ctx.restore();
    } else if (decoType === 'pine') {
      // blocky trunk + a layered leaf canopy (two overlapping clusters, Minecraft-tree style)
      const trunkColor = '#6e4a2e';
      const trunkW = 6 * scale, trunkH = 11 * scale;
      drawPixelBlock(sx - trunkW / 2, groundY - trunkH, trunkW, trunkH, slot * 5.5, [trunkColor, shadeColor(trunkColor, -0.18)], 2.8 * scale);
      const leafSize = 22 * scale;
      const upperSize = 16 * scale;
      drawPixelBlock(sx - leafSize / 2, groundY - trunkH - leafSize * 0.75, leafSize, leafSize * 0.75, slot * 7.7, [decoColor, lightDeco, darkDeco], 3.4 * scale);
      drawPixelBlock(sx - upperSize / 2, groundY - trunkH - leafSize * 0.75 - upperSize * 0.7, upperSize, upperSize * 0.7, slot * 12.3, [lightDeco, decoColor], 3 * scale);
    } else if (decoType === 'snowdrift') {
      const w = 26 * scale, h = 8 * scale;
      drawPixelBlock(sx - w / 2, groundY - h, w, h, slot * 25.9, ['#ffffff', '#eef6fa', '#dcedf4'], 3.2 * scale);
    }
    ctx.globalAlpha = 1;
  }
}

// Closest layer, scrolls faster than the ground, drawn after the mascot so it
// occasionally sweeps in front — a cheap, classic depth cue. Deliberately
// sparse and semi-transparent so it never actually blocks visibility of
// upcoming obstacles or collectibles.
function drawForegroundVegetation(blend) {
  const speedMult = 1.6;
  const spacing = 220;
  const color = lerpColor(blend.a.soil, blend.b.soil, blend.t);
  const startSlot = Math.floor((game.distance - game.mascot.x / speedMult - spacing) / spacing);
  const endSlot = Math.ceil((game.distance + (canvasWidth - game.mascot.x) / speedMult + spacing) / spacing);

  ctx.globalAlpha = 0.55;
  ctx.fillStyle = color;
  for (let slot = startSlot; slot <= endSlot; slot++) {
    const r = seededRandom(slot * 21.3);
    if (r > 0.4) continue;
    const worldX = slot * spacing + seededRandom(slot * 4.4) * 90;
    const sx = parallaxScreenX(worldX, speedMult);
    if (sx < -70 || sx > canvasWidth + 70) continue;
    const h = 46 + seededRandom(slot * 8.8) * 60;
    ctx.beginPath();
    ctx.moveTo(sx - 20, canvasHeight + 20);
    ctx.quadraticCurveTo(sx - 12, canvasHeight - h * 0.65, sx - 3, canvasHeight - h);
    ctx.quadraticCurveTo(sx + 10, canvasHeight - h * 0.55, sx + 20, canvasHeight + 20);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Rare, purely decorative Concrete-branded silhouettes in the far background.
// These live in the midground parallax plane, well behind the gameplay strip,
// and are never checked against collision — see updateObstacles/updateCollectibles,
// which this function has no connection to whatsoever.
const LANDMARK_TYPES = ['moai_giant', 'vault', 'cube', 'bag_giant', 'crane', 'shield', 'monolith'];

function drawLandmark(type, sx, baseY, scale, alpha) {
  ctx.save();
  ctx.translate(sx, baseY);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;

  if (type === 'moai_giant') {
    ctx.fillStyle = 'rgba(70,64,58,1)';
    roundRectPath(ctx, -22, -90, 44, 68, 8); ctx.fill();
    roundRectPath(ctx, -20, -92, 40, 16, 6); ctx.fill();
    ctx.fillStyle = 'rgba(40,36,32,1)';
    ctx.beginPath();
    ctx.ellipse(-9, -68, 4, 6, 0, 0, Math.PI * 2);
    ctx.ellipse(9, -68, 4, 6, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (type === 'vault') {
    ctx.fillStyle = 'rgba(28,32,40,1)';
    roundRectPath(ctx, -32, -64, 64, 64, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(212,167,60,0.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -32, 17, 0, Math.PI * 2); ctx.stroke();
  } else if (type === 'cube') {
    ctx.strokeStyle = 'rgba(212,167,60,0.85)';
    ctx.shadowColor = 'rgba(212,167,60,0.6)'; ctx.shadowBlur = 16;
    ctx.lineWidth = 2;
    ctx.strokeRect(-20, -46, 36, 36);
    ctx.strokeRect(-12, -56, 36, 36);
    ctx.beginPath();
    ctx.moveTo(-20, -46); ctx.lineTo(-12, -56);
    ctx.moveTo(16, -46); ctx.lineTo(24, -56);
    ctx.moveTo(-20, -10); ctx.lineTo(-12, -20);
    ctx.moveTo(16, -10); ctx.lineTo(24, -20);
    ctx.stroke();
  } else if (type === 'bag_giant') {
    ctx.fillStyle = 'rgba(212,167,60,0.9)';
    ctx.beginPath();
    ctx.moveTo(-22, -46); ctx.quadraticCurveTo(-27, -8, -16, -2);
    ctx.lineTo(16, -2); ctx.quadraticCurveTo(27, -8, 22, -46);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,222,150,0.6)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-13, -46); ctx.quadraticCurveTo(0, -58, 13, -46); ctx.stroke();
  } else if (type === 'crane') {
    ctx.strokeStyle = 'rgba(45,46,50,1)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -140);
    ctx.lineTo(76, -140);
    ctx.moveTo(0, -140); ctx.lineTo(-24, -122);
    ctx.moveTo(58, -140); ctx.lineTo(58, -108);
    ctx.stroke();
    ctx.fillStyle = 'rgba(45,46,50,1)';
    ctx.fillRect(-6, -6, 12, 6);
  } else if (type === 'shield') {
    ctx.strokeStyle = 'rgba(212,167,60,0.75)';
    ctx.shadowColor = 'rgba(212,167,60,0.55)'; ctx.shadowBlur = 18;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -56); ctx.lineTo(22, -42); ctx.lineTo(22, -14);
    ctx.quadraticCurveTo(22, 8, 0, 18); ctx.quadraticCurveTo(-22, 8, -22, -14);
    ctx.lineTo(-22, -42); ctx.closePath(); ctx.stroke();
  } else if (type === 'monolith') {
    ctx.fillStyle = 'rgba(22,23,27,1)';
    ctx.fillRect(-16, -130, 32, 130);
    ctx.fillStyle = 'rgba(212,167,60,0.25)';
    ctx.fillRect(-16, -130, 32, 3);
  }

  ctx.restore();
}

function drawLandmarks() {
  const speedMult = 0.32;
  const spacing = 1500;
  const startSlot = Math.floor((game.distance - game.mascot.x / speedMult - spacing) / spacing);
  const endSlot = Math.ceil((game.distance + (canvasWidth - game.mascot.x) / speedMult + spacing) / spacing);

  for (let slot = startSlot; slot <= endSlot; slot++) {
    const r = seededRandom(slot * 31.7);
    if (r > 0.5) continue;
    const worldX = slot * spacing + seededRandom(slot * 5.1) * 400;
    const sx = parallaxScreenX(worldX, speedMult);
    if (sx < -160 || sx > canvasWidth + 160) continue;
    const type = LANDMARK_TYPES[Math.floor(seededRandom(slot * 17.3) * LANDMARK_TYPES.length)];
    const scale = 0.8 + seededRandom(slot * 12.2) * 0.7;
    drawLandmark(type, sx, groundY - 2, scale, 0.5);
  }
}

// Final low-opacity color wash per biome — cheap stand-in for per-biome lighting
// without needing real per-object light calculations.
function drawAtmosphereTint(blend) {
  ctx.fillStyle = blend.t < 0.5 ? blend.a.atmosphere : blend.b.atmosphere;
  ctx.fillRect(-40, -40, canvasWidth + 80, canvasHeight + 80);
}

function drawWeather() {
  const w = game.weather;
  if (!w.type) return;
  const fadeIn = clamp(1 - w.timeLeft / 800, 0, 1);
  if (w.type === 'rain') {
    ctx.strokeStyle = `rgba(180,210,255,${0.35 * fadeIn})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const seed = i + Math.floor(game.time * 8);
      const rx = seededRandom(seed * 4.4) * canvasWidth;
      const ry = (seededRandom(seed * 2.2) * canvasHeight + game.time * 900) % canvasHeight;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 6, ry + 14);
      ctx.stroke();
    }
  } else if (w.type === 'fog') {
    ctx.fillStyle = `rgba(255,255,255,${0.16 * fadeIn})`;
    ctx.fillRect(-40, -40, canvasWidth + 80, canvasHeight + 80);
  } else if (w.type === 'wind') {
    ctx.strokeStyle = `rgba(255,255,255,${0.25 * fadeIn})`;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 10; i++) {
      const seed = i + Math.floor(game.time * 3);
      const wx = (seededRandom(seed * 6.6) * canvasWidth * 2 - game.time * 220) % (canvasWidth + 80);
      const wy = groundY * (0.3 + seededRandom(seed * 1.9) * 0.6);
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + 18, wy - 3);
      ctx.stroke();
    }
  }
}

/* ------------------------- 8. MASCOT ------------------------------------ */
function updateMascot(dt) {
  const m = game.mascot;
  m.stateTime += dt;

  if (game.state === STATE.PLAYING) {
    if (!m.onGround) {
      m.vy += CONFIG.gravity * dt;
      m.y += m.vy * dt;
      if (m.y >= groundY - m.h) {
        m.y = groundY - m.h;
        m.vy = 0;
        m.onGround = true;
        m.state = 'land';
        m.stateTime = 0;
        playLandSound();
        spawnDust(m.x + m.w * 0.5, groundY, 5);
        triggerCameraBounce();
      }
    }
    if (m.onGround) {
      m.runCycle += dt * (5.5 + game.speed / 130);
      if (m.state === 'land' && m.stateTime > 0.14) m.state = 'run';
      else if (m.state !== 'land') m.state = 'run';
      if (Math.random() < dt * 4) spawnDust(m.x + m.w * 0.42, groundY, 1);
    } else {
      m.state = 'jump';
    }
  } else if (game.state === STATE.START) {
    m.state = 'idle';
    m.blinkTimer -= dt;
    if (m.blinkTimer < -0.12) m.blinkTimer = randRange(2, 5);
    m.y = groundY - m.h;
    m.onGround = true;
  }
}

function tryJump() {
  if (game.state !== STATE.PLAYING) return;
  const m = game.mascot;
  if (!m.onGround) return;
  m.vy = CONFIG.jumpVelocity;
  m.onGround = false;
  m.state = 'jump';
  game.jumpsThisRun++;
  stats.totalJumps++;
  playJumpSound();
}

function drawMascot() {
  const m = game.mascot;
  const rainbow = settings.rainbowSkin && settings.rainbowSkinUnlocked;
  let scaleX = 1, scaleY = 1, bobY = 0;

  if (m.state === 'idle') {
    bobY = Math.sin(game.time * 2.2) * 3;
  } else if (m.state === 'run') {
    scaleY = 1 + Math.sin(m.runCycle * 2) * 0.04;
    scaleX = 1 - Math.sin(m.runCycle * 2) * 0.03;
  } else if (m.state === 'jump') {
    const ascending = m.vy < 0;
    scaleY = ascending ? 1.13 : 1.05;
    scaleX = ascending ? 0.91 : 0.97;
  } else if (m.state === 'land') {
    const p = clamp(m.stateTime / 0.14, 0, 1);
    scaleY = lerp(0.66, 1, p);
    scaleX = lerp(1.24, 1, p);
  }

  const feetX = m.x + m.w / 2;
  const feetY = m.y + m.h + bobY;
  const legsVisible = m.state !== 'jump';

  const airHeight = clamp(groundY - (m.y + m.h), 0, 160);
  const shadowScale = clamp(1 - airHeight / 160, 0.32, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(feetX, groundY + 3, m.w * 0.4 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(feetX, feetY);
  ctx.scale(scaleX, scaleY);

  const legPhase = Math.sin(m.runCycle * 2);
  const legSwing = m.state === 'run' ? legPhase * 6 : 0;
  const armSwing = m.state === 'run' ? -legPhase * 5 : 0;

  const bodyShades = rainbow ? ['#ffb3ec', '#ffd6f5', '#c9a3ff'] : ['#9aa3b3', '#b7bfcc', '#7c8494'];
  const armShades = rainbow ? ['#e896d8', '#ffd6f5'] : ['#7c8494', '#69707e'];
  const accentStroke = rainbow ? 'rgba(255,255,255,0.85)' : 'rgba(212,167,60,0.75)';
  const accentGlow = rainbow ? 'rgba(255,255,255,0.6)' : 'rgba(212,167,60,0.6)';

  // legs
  ctx.fillStyle = '#333a47';
  if (legsVisible) {
    roundRectPath(ctx, -19 + legSwing * 0.3, -16, 9, 16, 3);
    ctx.fill();
    roundRectPath(ctx, 10 - legSwing * 0.3, -16, 9, 16, 3);
    ctx.fill();
  } else {
    roundRectPath(ctx, -17, -23, 10, 12, 3);
    ctx.fill();
    roundRectPath(ctx, 7, -23, 10, 12, 3);
    ctx.fill();
  }

  // back arm — a visibly different (darker) shade from the torso so it reads as
  // a separate limb rather than blending into the body's texture
  const armY = legsVisible ? -30 - Math.max(0, armSwing) : -34;
  drawPixelBlock(18, armY, 5, 17, 501, armShades, 3.2);

  // torso — the dominant mass, blocky pixel texture matching the ground/obstacles
  drawPixelBlock(-21, -40, 42, 23, 401, bodyShades, 4.6);
  ctx.strokeStyle = accentStroke;
  ctx.lineWidth = 1.5;
  roundRectPath(ctx, -21, -40, 42, 23, 7);
  ctx.stroke();

  ctx.strokeStyle = accentStroke;
  ctx.shadowColor = accentGlow;
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.moveTo(-21, -31);
  ctx.lineTo(21, -31);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // chest emblem — small glowing diamond, a nod to the bag/vault iconography
  ctx.save();
  ctx.translate(0, -24);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = rainbow ? '#ffffff' : '#e8c878';
  ctx.shadowColor = accentGlow;
  ctx.shadowBlur = 9;
  ctx.fillRect(-4, -4, 8, 8);
  ctx.restore();

  // front arm
  drawPixelBlock(-23, armY, 5, 17, 502, armShades, 3.2);

  // head — clearly smaller than the torso so it reads as a head sitting on
  // shoulders, not a second body stacked on top
  drawPixelBlock(-11, -58, 22, 16, 402, bodyShades, 3.5);
  ctx.strokeStyle = accentStroke;
  roundRectPath(ctx, -11, -58, 22, 16, 6);
  ctx.stroke();

  // eyes — rounder, with a highlight dot so they read as alive rather than flat dots
  const blink = m.state === 'idle' && Math.abs(m.blinkTimer) < 0.1;
  const eyeH = blink ? 1 : 5;
  ctx.fillStyle = '#1a1d24';
  roundRectPath(ctx, -6.5, -51 - eyeH / 2, 4.5, eyeH, 2);
  ctx.fill();
  roundRectPath(ctx, 2, -51 - eyeH / 2, 4.5, eyeH, 2);
  ctx.fill();
  if (!blink) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-6, -51 - eyeH / 2, 1.4, 1.4);
    ctx.fillRect(2.5, -51 - eyeH / 2, 1.4, 1.4);
  }

  ctx.restore();
}

/* ------------------------- 9. OBSTACLES (moai) --------------------------- */
function currentJumpClearance() {
  const airTime = (-2 * CONFIG.jumpVelocity) / CONFIG.gravity;
  return game.speed * airTime;
}
function minObstacleGap() {
  return currentJumpClearance() * CONFIG.obstacleGapSafetyMult + CONFIG.obstacleGapSafetyPad;
}

function placeObstacle(worldX, sizeDef) {
  const h = randRange(sizeDef.hMin, sizeDef.hMax);
  game.obstacles.push({ worldX, height: h, width: h * 0.62, passed: false });
}

function spawnObstaclePattern() {
  const gap = minObstacleGap();
  const types = ['single', 'single', 'double', 'tall'];
  let pattern = types[randInt(0, types.length - 1)];
  if (pattern === game.lastPatternType) pattern = types[(types.indexOf(pattern) + 1) % types.length];
  game.lastPatternType = pattern;

  const baseX = game.nextObstacleAtWorldX;

  if (pattern === 'single') {
    placeObstacle(baseX, OBSTACLE_SIZES[randInt(0, 1)]);
    game.nextObstacleAtWorldX = baseX + gap + randRange(0, 260);
  } else if (pattern === 'tall') {
    placeObstacle(baseX, OBSTACLE_SIZES[2]);
    game.nextObstacleAtWorldX = baseX + gap + randRange(40, 300);
  } else if (pattern === 'double') {
    const sz = OBSTACLE_SIZES[0];
    placeObstacle(baseX, sz);
    placeObstacle(baseX + sz.hMax * 0.9 + 26, sz);
    game.nextObstacleAtWorldX = baseX + gap + randRange(60, 260);
  }
}

function checkObstacleCollision(o, sx) {
  const m = game.mascot;
  const ox0 = sx + o.width * 0.16, ox1 = sx + o.width * 0.84;
  const oy0 = groundY - o.height, oy1 = groundY;
  const mx0 = m.x + m.w * 0.22, mx1 = m.x + m.w * 0.78;
  const my0 = m.y + m.h * 0.12, my1 = m.y + m.h;
  return mx1 > ox0 && mx0 < ox1 && my1 > oy0 && my0 < oy1;
}

function updateObstacles(dt) {
  if (game.distance + (canvasWidth - game.mascot.x) + 200 > game.nextObstacleAtWorldX) {
    spawnObstaclePattern();
  }
  for (let i = game.obstacles.length - 1; i >= 0; i--) {
    const o = game.obstacles[i];
    const sx = worldToScreenX(o.worldX);
    if (!o.passed && sx + o.width < game.mascot.x) {
      o.passed = true;
      game.obstaclesPassedThisRun++;
    }
    if (checkObstacleCollision(o, sx)) { endGame(sx); return; }
    if (sx < -80) game.obstacles.splice(i, 1);
  }
}

function drawObstacles() {
  for (const o of game.obstacles) {
    const sx = worldToScreenX(o.worldX);
    if (sx < -80 || sx > canvasWidth + 80) continue;
    const w = o.width, h = o.height;
    const seed = Math.round(o.worldX);
    const stoneShades = ['#8b8378', '#a1988a', '#726b60'];
    ctx.save();
    ctx.translate(sx + w / 2, groundY);
    ctx.strokeStyle = 'rgba(212,167,60,0.3)';
    ctx.lineWidth = 1.5;
    drawPixelBlock(-w / 2, -h, w, h * 0.72, seed, stoneShades, Math.max(2.4, w * 0.09));
    roundRectPath(ctx, -w / 2, -h, w, h * 0.72, w * 0.18);
    ctx.stroke();
    drawPixelBlock(-w / 2 * 0.95, -h, w * 0.95, h * 0.16, seed + 7, ['#6f685e', '#847a6c'], Math.max(2.2, w * 0.08));
    ctx.fillStyle = '#2c2a26';
    ctx.beginPath();
    ctx.ellipse(-w * 0.2, -h * 0.78, w * 0.11, h * 0.05, 0, 0, Math.PI * 2);
    ctx.ellipse(w * 0.2, -h * 0.78, w * 0.11, h * 0.05, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#928a7d';
    ctx.beginPath();
    ctx.moveTo(-w * 0.09, -h * 0.7);
    ctx.lineTo(w * 0.09, -h * 0.7);
    ctx.lineTo(0, -h * 0.45);
    ctx.closePath();
    ctx.fill();
    drawPixelBlock(-w / 2 * 1.05, -h * 0.3, w * 1.05, h * 0.3, seed + 13, ['#6f685e', '#847a6c', '#5a5348'], Math.max(2.4, w * 0.09));
    ctx.restore();
  }
}

/* ------------------------- 10. COLLECTIBLES (bags) ------------------------ */
function spawnBag() {
  const type = weightedPick(BAG_TYPES);
  const laneRoll = Math.random();
  const yOffset = laneRoll < 0.45 ? 0 : (laneRoll < 0.8 ? 90 : 145);
  const worldX = game.distance + (canvasWidth - game.mascot.x) + randRange(40, 160);
  game.collectibles.push({ worldX, yOffset, rarity: type.rarity, value: type.value, color: type.color, glow: type.glow, bobPhase: Math.random() * Math.PI * 2 });
}

function updateBagSpawning(dt) {
  game.bagSpawnTimer -= dt * 1000;
  if (game.bagSpawnTimer <= 0) {
    spawnBag();
    game.bagSpawnTimer = randRange(650, 1300);
  }
}

function checkBagCollision(c, sx) {
  const m = game.mascot;
  const cy = groundY - 26 - c.yOffset + Math.sin(c.bobPhase) * 5;
  const dx = sx - (m.x + m.w / 2);
  const dy = cy - (m.y + m.h / 2);
  return Math.sqrt(dx * dx + dy * dy) < 30;
}

function collectBag(c) {
  game.score += c.value;
  game.bags++;
  stats.totalBags++;
  if (c.rarity === 'rainbow') game.rainbowThisRun++;
  setScore(game.score);
  bagValueEl.textContent = game.bags;
  const sx = worldToScreenX(c.worldX);
  const cy = groundY - 26 - c.yOffset;
  spawnSparkleBurst(sx, cy, c.color);
  playCollectSound(c.rarity);
}

function updateCollectibles(dt) {
  for (let i = game.collectibles.length - 1; i >= 0; i--) {
    const c = game.collectibles[i];
    c.bobPhase += dt * 3;
    const sx = worldToScreenX(c.worldX);
    if (checkBagCollision(c, sx)) { collectBag(c); game.collectibles.splice(i, 1); continue; }
    if (sx < -60) game.collectibles.splice(i, 1);
  }
}

function drawCollectibles() {
  for (const c of game.collectibles) {
    const sx = worldToScreenX(c.worldX);
    if (sx < -40 || sx > canvasWidth + 40) continue;
    const cy = groundY - 26 - c.yOffset + Math.sin(c.bobPhase) * 5;
    ctx.save();
    ctx.translate(sx, cy);
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = c.rarity === 'rainbow' ? 16 : 11;
    ctx.fillStyle = c.color;
    ctx.strokeStyle = c.glow;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-11, -4);
    ctx.quadraticCurveTo(-13, 16, -8, 18);
    ctx.lineTo(8, 18);
    ctx.quadraticCurveTo(13, 16, 11, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-6, -4);
    ctx.quadraticCurveTo(0, -12, 6, -4);
    ctx.stroke();
    ctx.restore();
  }
}

/* ------------------------- 11. PARTICLES / EFFECTS ------------------------ */
function spawnDust(x, y, count) {
  for (let i = 0; i < count; i++) {
    game.particles.push({ x: x + randRange(-6, 6), y, vx: randRange(-40, -10), vy: randRange(-30, -60), life: 0, duration: randRange(0.3, 0.5), size: randRange(2, 4), color: '190,190,198' });
  }
}
function spawnSparkleBurst(x, y, colorHex) {
  const rgb = hexToRgb(colorHex);
  const colorStr = rgb.r + ',' + rgb.g + ',' + rgb.b;
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI * 2 / 10) * i + Math.random() * 0.4;
    const speed = 60 + Math.random() * 100;
    game.particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0, duration: 0.5, size: 2.4, color: colorStr });
  }
}
function updateParticles(dt) {
  for (const p of game.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.life += dt; }
  game.particles = game.particles.filter(p => p.life < p.duration);
}
function drawParticles() {
  for (const p of game.particles) {
    const alpha = clamp(1 - p.life / p.duration, 0, 1);
    ctx.beginPath();
    ctx.fillStyle = 'rgba(' + p.color + ',' + alpha + ')';
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
function triggerShake(mag, duration) { game.shakeMag = mag; game.shakeTime = duration; game.shakeDuration = duration; }
function updateShake(dt) { if (game.shakeTime > 0) game.shakeTime = Math.max(0, game.shakeTime - dt); }

/* ------------------------- 12. ACHIEVEMENTS ------------------------------ */
let toastShowing = false;

function showAchievementToast(a) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = a.name;
  achievementToastsEl.appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function processAchievementQueue() {
  if (toastShowing || game.achievementQueue.length === 0) return;
  toastShowing = true;
  const a = game.achievementQueue.shift();
  showAchievementToast({ name: 'ACHIEVEMENT — ' + a.name });
  playAchievementSound();
  setTimeout(() => { toastShowing = false; processAchievementQueue(); }, 900);
}

function checkAchievements() {
  const newly = [];
  function tryUnlock(id) {
    if (!achievements[id]) {
      achievements[id] = true;
      const def = ACHIEVEMENT_DEFS.find(a => a.id === id);
      if (def) newly.push(def);
    }
  }
  if (stats.gamesPlayed >= 1) tryUnlock('first_run');
  if (stats.totalBags >= 100) tryUnlock('bags_100');
  if (stats.totalBags >= 1000) tryUnlock('bags_1000');
  if (stats.totalDistance >= 5000) tryUnlock('dist_5000');
  if (game.obstaclesPassedThisRun >= 30) tryUnlock('moai_survivor');
  if (game.score >= 5000) tryUnlock('legend');

  if (newly.length) {
    saveAchievements(achievements);
    game.achievementQueue.push(...newly);
    processAchievementQueue();
  }
}

function checkSkinUnlock() {
  if (game.rainbowThisRun >= 3 && !settings.rainbowSkinUnlocked) {
    settings.rainbowSkinUnlocked = true;
    saveSettings(settings);
    skinToggleRow.style.display = 'flex';
    game.achievementQueue.push({ name: 'Rainbow skin unlocked!' });
    processAchievementQueue();
  }
}

/* ------------------------- 14. UPDATE -------------------------------------- */
function updateAmbient(dt) {
  game.time += dt;
  updateMascot(dt);
  updateParticles(dt);
  updateShake(dt);
  updateCamera(dt);
}

function updateGameplay(dt) {
  game.distance += game.speed * dt;
  game.speed = lerp(CONFIG.runSpeedStart, CONFIG.runSpeedMax, clamp(game.distance / CONFIG.speedRampDistance, 0, 1));
  updateWeather(dt);
  updateObstacles(dt);
  if (game.state !== STATE.PLAYING) return;
  updateBagSpawning(dt);
  updateCollectibles(dt);
}

/* ------------------------- 15. RENDER -------------------------------------- */
function render() {
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);
  ctx.save();

  if (game.shakeTime > 0) {
    const mag = game.shakeMag * (game.shakeTime / game.shakeDuration);
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }

  // Speed-based zoom, pivoted near the action so the mascot stays framed as the
  // view pulls back slightly at higher speed. Combined with the follow/bounce
  // offset from updateCamera(). Purely visual — gameplay coordinates never see this.
  const pivotX = game.mascot.x + game.mascot.w / 2;
  const pivotY = groundY - canvasHeight * 0.15;
  ctx.translate(pivotX, pivotY);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-pivotX, -pivotY + camera.offsetY);

  const blend = biomeBlend();
  drawSky(blend);
  drawClouds(lerpColor(blend.a.clouds, blend.b.clouds, blend.t), 0.3);
  drawParallaxLayer(lerpColor(blend.a.mountains, blend.b.mountains, blend.t), 0.15, groundY * 0.55, groundY * 0.4, 220);
  drawLandmarks();
  drawMidground(blend);
  drawGround(blend);
  drawDecorations(blend);
  drawObstacles();
  drawCollectibles();
  drawParticles();
  drawMascot();
  drawForegroundVegetation(blend);
  drawWeather();
  drawAtmosphereTint(blend);

  ctx.restore();
}

const LEADERBOARD_API = '/api/leaderboard';

// Tries the shared online leaderboard first; falls back to this device's local
// copy if the API times out, errors, or hasn't been set up yet (see README).
async function fetchOnlineLeaderboard() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 4000);
  try {
    const res = await fetch(LEADERBOARD_API, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    return { entries: data.entries || [], online: true };
  } catch (e) {
    clearTimeout(timer);
    return { entries: loadLeaderboard(), online: false };
  }
}

// Fire-and-forget: pushes this run to the shared leaderboard if the API is live.
// The local copy is already saved regardless, so this never blocks or breaks a run.
function submitOnlineScore(entry) {
  fetch(LEADERBOARD_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entry),
  }).catch(() => { /* offline or not configured yet — local copy already has it */ });
}

async function refreshLeaderboard() {
  leaderboardListEl.innerHTML = '';
  leaderboardStatusEl.textContent = 'Loading...';

  const { entries, online } = await fetchOnlineLeaderboard();
  leaderboardListEl.innerHTML = '';

  if (entries.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'lb-empty';
    empty.textContent = 'No runs yet. Be the first to bag some yield.';
    leaderboardListEl.appendChild(empty);
  } else {
    entries.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row' + (i === 0 ? ' rank-gold' : i === 1 ? ' rank-silver' : i === 2 ? ' rank-bronze' : '');
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = '#' + (i + 1);
      const name = document.createElement('span'); name.className = 'name'; name.textContent = entry.name;
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = entry.score;
      row.appendChild(rank); row.appendChild(name); row.appendChild(sc);
      leaderboardListEl.appendChild(row);
    });
  }

  leaderboardStatusEl.textContent = online ? 'Live global leaderboard' : 'Offline — showing local scores only';
}

function spawnImpactBurst(x, y) {
  for (let i = 0; i < 14; i++) {
    const a = (Math.PI * 2 / 14) * i + Math.random() * 0.4;
    const speed = 80 + Math.random() * 120;
    game.particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0, duration: 0.55, size: 2.6, color: '255,84,104' });
  }
}

function flashRed() {
  flashOverlayEl.classList.remove('flash');
  void flashOverlayEl.offsetWidth;
  flashOverlayEl.classList.add('flash');
}

function resetRun() {
  game.score = 0;
  game.bags = 0;
  game.distance = 0;
  game.speed = CONFIG.runSpeedStart;
  game.obstacles = [];
  game.collectibles = [];
  game.particles = [];
  game.nextObstacleAtWorldX = 500;
  game.bagSpawnTimer = 700;
  game.lastPatternType = null;
  game.obstaclesPassedThisRun = 0;
  game.jumpsThisRun = 0;
  game.rainbowThisRun = 0;
  game.weather = { type: null, timeLeft: 0, nextCheckIn: randRange(CONFIG.weatherCheckMin, CONFIG.weatherCheckMax) };
  game.mascot.vy = 0;
  game.mascot.onGround = true;
  game.mascot.y = groundY - game.mascot.h;
  game.mascot.state = 'run';
  setScore(0);
  bagValueEl.textContent = '0';
}

function startGame() {
  ensureAudio();
  playClickSound();
  const nameVal = usernameInputEl.value.trim();
  username = nameVal || 'Runner';
  saveUsername(username);
  resetRun();
  game.state = STATE.PLAYING;
  hudEl.classList.remove('hidden');
  showScreen(null);
  startMusic();
}

function endGame(collisionX) {
  game.state = STATE.GAMEOVER;
  const m = game.mascot;
  const cy = m.y + m.h * 0.5;
  spawnImpactBurst(typeof collisionX === 'number' ? collisionX : m.x + m.w / 2, cy);
  playHitSound();
  triggerShake(12, 0.4);
  flashRed();
  stopMusic();

  stats.gamesPlayed++;
  stats.totalDistance += Math.floor(game.distance / DISTANCE_UNIT);
  let isNewBest = false;
  if (game.score > stats.bestScore) { stats.bestScore = game.score; isNewBest = true; }
  saveStats(stats);

  const leaderboardEntry = { name: username || 'Runner', score: game.score, distance: Math.floor(game.distance / DISTANCE_UNIT), bags: game.bags, date: new Date().toISOString().slice(0, 10) };
  addLeaderboardEntry(leaderboardEntry);
  submitOnlineScore(leaderboardEntry);

  checkAchievements();
  checkSkinUnlock();

  gameOverMessageEl.textContent = GAME_OVER_MESSAGES[randInt(0, GAME_OVER_MESSAGES.length - 1)];
  refreshGameOverStats(game.distance);
  newBestBadgeEl.style.display = isNewBest ? 'block' : 'none';
  updateHighScoreDisplays();

  setTimeout(() => { hudEl.classList.add('hidden'); showScreen(gameOverScreenEl); }, 500);
}

function togglePause() {
  if (game.state === STATE.PLAYING) {
    playClickSound();
    game.state = STATE.PAUSED;
    pauseBtn.textContent = '▶';
    showScreen(pauseScreenEl);
  } else if (game.state === STATE.PAUSED) {
    playClickSound();
    game.state = STATE.PLAYING;
    pauseBtn.textContent = '⏸';
    showScreen(null);
    game.lastTime = 0;
  }
}

function quitToMenu() {
  playClickSound();
  game.state = STATE.START;
  hudEl.classList.add('hidden');
  pauseBtn.textContent = '⏸';
  stopMusic();
  showScreen(startScreenEl);
}

// Static, non-animated version of the mascot for the share card. Kept separate from
// drawMascot() so the card layout can never affect (or be affected by) live game state.
function drawMascotIcon(c2, x, y, scale) {
  c2.save();
  c2.translate(x, y);
  c2.scale(scale, scale);
  c2.fillStyle = '#333a47';
  roundRectPath(c2, -19, -16, 9, 16, 3); c2.fill();
  roundRectPath(c2, 10, -16, 9, 16, 3); c2.fill();
  const grad = c2.createLinearGradient(0, -58, 0, -17);
  grad.addColorStop(0, '#b7bfcc');
  grad.addColorStop(1, '#7c8494');
  const armGrad = c2.createLinearGradient(0, -30, 0, -13);
  armGrad.addColorStop(0, '#7c8494');
  armGrad.addColorStop(1, '#69707e');
  c2.fillStyle = armGrad;
  roundRectPath(c2, 18, -30, 5, 17, 2); c2.fill();
  c2.strokeStyle = 'rgba(212,167,60,0.6)';
  c2.lineWidth = 1.5;
  c2.fillStyle = grad;
  roundRectPath(c2, -21, -40, 42, 23, 7); c2.fill(); c2.stroke();
  c2.strokeStyle = 'rgba(212,167,60,0.9)';
  c2.beginPath(); c2.moveTo(-21, -31); c2.lineTo(21, -31); c2.stroke();
  c2.save();
  c2.translate(0, -24); c2.rotate(Math.PI / 4);
  c2.fillStyle = '#e8c878';
  c2.fillRect(-3.6, -3.6, 7.2, 7.2);
  c2.restore();
  c2.fillStyle = armGrad;
  roundRectPath(c2, -23, -30, 5, 17, 2); c2.fill();
  c2.fillStyle = grad;
  roundRectPath(c2, -11, -58, 22, 16, 6); c2.fill();
  c2.strokeStyle = 'rgba(212,167,60,0.6)'; c2.stroke();
  c2.fillStyle = '#1a1d24';
  roundRectPath(c2, -6.5, -53.5, 4.5, 5, 2); c2.fill();
  roundRectPath(c2, 2, -53.5, 4.5, 5, 2); c2.fill();
  c2.fillStyle = 'rgba(255,255,255,0.85)';
  c2.fillRect(-6, -53.5, 1.4, 1.4);
  c2.fillRect(2.5, -53.5, 1.4, 1.4);
  c2.restore();
}

  c2.fillRect(0, 0, w, h);

  c2.strokeStyle = 'rgba(212,167,60,0.35)';
  c2.lineWidth = 3;
  c2.strokeRect(6, 6, w - 12, h - 12);

  c2.fillStyle = '#f5f4f0';
  c2.font = '800 34px ' + FONT_MONO;
  c2.textAlign = 'left';
  c2.fillText('MOAI MILES', 64, 92);

  c2.fillStyle = 'rgba(232,200,120,0.9)';

    c2.fillStyle = '#6b6a64';
    c2.font = '600 13px ' + FONT_MONO;
    c2.fillText(s.l, cx2, 434);

  c2.textAlign = 'left';
  c2.fillText('Built by @22kian_  \u00B7  Inspired by Concrete', 64, h - 56);

  return card;
}

function openXIntent(caption, gameUrl) {
  const intentUrl = 'https://twitter.com/intent/tweet'
    + '?text=' + encodeURIComponent(caption)
    + '&url=' + encodeURIComponent(gameUrl)
    + '&hashtags=' + encodeURIComponent('Concrete,DeFi');
  window.open(intentUrl, '_blank', 'noopener,noreferrer');
}

function downloadCardFile(card) {
  const dataUrl = card.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'moai-miles-score.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function shareScore() {
  playClickSound();
  const card = generateShareCardCanvas();
  const distanceM = Math.floor(game.distance / DISTANCE_UNIT);
  const caption = 'Scored ' + Math.floor(game.score) + ' on Moai Miles \uD83D\uDDFF ' + game.bags +
    ' bags, ' + distanceM + 'm run. Can you beat it? Built by @22kian_';
  const gameUrl = window.location.origin + window.location.pathname;

  card.toBlob(async (blob) => {
    if (!blob) { openXIntent(caption, gameUrl); return; }
    const file = new File([blob], 'moai-miles-score.png', { type: 'image/png' });

    // Best case (mainly mobile): the image genuinely attaches to whatever the
    // user picks in their share sheet — X's app, X on web, anywhere else.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], text: caption, title: 'Moai Miles' });
        return;
      } catch (e) {
        // user backed out of the share sheet — fall through to the link below
      }
    }

    // Fallback (mainly desktop): X's web intent link has no way to carry an
    // attached image — that's a restriction on X's side, not something a site
    // can work around. So we download the card and open X with the caption
    // ready, turning it into a two-second manual attach instead of a blank post.
    downloadCardFile(card);
    openXIntent(caption, gameUrl);
    shareBtn.textContent = 'CARD SAVED — OPENING X...';
    setTimeout(() => { shareBtn.textContent = 'SHARE ON X'; }, 2400);
  }, 'image/png');
}

/* ------------------------- 17. MAIN LOOP + INIT ----------------------------- */
function resizeCanvas() {
  const rect = gameContainer.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasWidth = rect.width;
  canvasHeight = rect.height;
  canvas.width = Math.floor(canvasWidth * dpr);
  canvas.height = Math.floor(canvasHeight * dpr);
  canvas.style.width = canvasWidth + 'px';
  canvas.style.height = canvasHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  groundY = canvasHeight * 0.78;
  game.mascot.x = canvasWidth * 0.16;
  game.mascot.w = clamp(canvasWidth * 0.06, 40, 60);
  game.mascot.h = game.mascot.w * 1.05;
  if (game.mascot.onGround) game.mascot.y = groundY - game.mascot.h;
}

function loop(timestamp) {
  requestAnimationFrame(loop);
  if (!game.lastTime) game.lastTime = timestamp;
  let dt = (timestamp - game.lastTime) / 1000;
  game.lastTime = timestamp;
  dt = Math.min(dt, CONFIG.maxDeltaTime);

  updateAmbient(dt);
  if (game.state === STATE.PLAYING) updateGameplay(dt);
  render();
}

function init() {
  resizeCanvas();
  game.mascot.y = groundY - game.mascot.h;
  usernameInputEl.value = username;
  applySettingsToUI();
  updateHighScoreDisplays();
  [startScreenEl, settingsScreenEl, leaderboardScreenEl, pauseScreenEl, gameOverScreenEl].forEach(addCornerFrame);

  document.addEventListener('pointerdown', initAudioOnce);
  document.addEventListener('keydown', initAudioOnce);

  playBtn.addEventListener('click', startGame);
  leaderboardBtn.addEventListener('click', async () => { playClickSound(); showScreen(leaderboardScreenEl); await refreshLeaderboard(); });
  settingsBtn.addEventListener('click', () => { playClickSound(); refreshSettingsStats(); showScreen(settingsScreenEl); });
  closeSettingsBtn.addEventListener('click', () => { playClickSound(); showScreen(startScreenEl); });
  closeLeaderboardBtn.addEventListener('click', () => { playClickSound(); showScreen(startScreenEl); });
  resetStatsBtn.addEventListener('click', resetProgress);
  pauseBtn.addEventListener('click', togglePause);
  resumeBtn.addEventListener('click', togglePause);
  quitBtn.addEventListener('click', quitToMenu);
  menuBtn.addEventListener('click', quitToMenu);
  restartBtn.addEventListener('click', startGame);
  shareBtn.addEventListener('click', shareScore);
  usernameInputEl.addEventListener('keydown', (e) => { if (e.code === 'Enter') { e.preventDefault(); startGame(); } });

  sfxToggle.addEventListener('change', () => { settings.sfx = sfxToggle.checked; saveSettings(settings); muteBtn.textContent = settings.sfx ? '🔊' : '🔇'; });
  musicToggle.addEventListener('change', () => {
    settings.music = musicToggle.checked; saveSettings(settings);
    if (settings.music && game.state === STATE.PLAYING) startMusic(); else stopMusic();
  });
  skinToggle.addEventListener('change', () => { settings.rainbowSkin = skinToggle.checked; saveSettings(settings); });
  muteBtn.addEventListener('click', () => {
    const newState = !(settings.sfx || settings.music);
    settings.sfx = newState; settings.music = newState;
    saveSettings(settings);
    muteBtn.textContent = newState ? '🔊' : '🔇';
    sfxToggle.checked = settings.sfx; musicToggle.checked = settings.music;
    if (settings.music && game.state === STATE.PLAYING) startMusic(); else stopMusic();
  });

  window.addEventListener('resize', debounce(resizeCanvas, 150));
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
